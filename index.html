// ============ AUDIO (tiny Web Audio pops) ============
let audioCtx = null;
const getCtx = () => {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
  return audioCtx;
};
const pop = (freq, dur = 0.08, type = 'sine', vol = 0.18) => {
  const ctx = getCtx(); if (!ctx) return;
  const o = ctx.createOscillator(); const g = ctx.createGain();
  o.type = type; o.frequency.value = freq;
  o.connect(g); g.connect(ctx.destination);
  const t = ctx.currentTime;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.start(t); o.stop(t + dur + 0.02);
};
const sndMatch  = (n) => { pop(520 + Math.min(n, 20) * 35, 0.10, 'triangle', 0.16); setTimeout(() => pop(780 + Math.min(n, 20) * 40, 0.08, 'sine', 0.12), 50); };
const sndMiss   = () => { pop(180, 0.18, 'sawtooth', 0.10); };

// ============ HELPERS ============
const rand = (a, b) => a + Math.random() * (b - a);
const pickWeighted = (counts) => {
  // Prefer species with exactly 1 instance currently on screen (keeps pairs alive),
  // then species with 0 instances, then anything.
  const singletons = SPECIES.filter(s => counts[s] === 1);
  if (singletons.length && Math.random() < 0.65) {
    return singletons[Math.floor(Math.random() * singletons.length)];
  }
  const empties = SPECIES.filter(s => counts[s] === 0);
  if (empties.length && Math.random() < 0.5) {
    return empties[Math.floor(Math.random() * empties.length)];
  }
  return SPECIES[Math.floor(Math.random() * SPECIES.length)];
};

  const [roundPeak, setRoundPeak] = useState(0);           // peak streak this round
  const [showHowTo, setShowHowTo] = useState(false);       // how-to-play overlay
  const [, force] = useState(0);
  const forceRender = useCallback(() => force(x => (x + 1) & 0xffff), []);

  const containerRef = useRef(null);
  const fishRef = useRef([]);              // [{id, species, row, x, w, h, speed, dir, flip, caught, caughtAt}]
  const elsRef = useRef({});               // id -> DOM node
  const popsRef = useRef([]);              // floating "+N" pops
  const dims = useRef({ w: 0, h: 0, rowH: 0 });
  const lastT = useRef(0);
  const rafRef = useRef(0);
  const idCount = useRef(1);
  const flashT = useRef(null);

  // Always-fresh refs for state read inside RAF loop
  const streakRef = useRef(0);
  const targetRef = useRef(null);
  const timeLeftRef = useRef(ROUND_SECONDS);
  const roundPeakRef = useRef(0);
  const prevBestRef = useRef(0);     // best at start of round (for "new best" detection)
  const lastSecRef = useRef(ROUND_SECONDS); // throttle setTimeLeft to once per integer second
  const timeBarRef = useRef(null);   // direct DOM updates for smooth bar
  useEffect(() => { streakRef.current = streak; }, [streak]);
  useEffect(() => { targetRef.current = target; }, [target]);

  // ============ DIMS ============
  useEffect(() => {
    const compute = () => {
      const el = containerRef.current;
      if (!el) return;
      const r = el.getBoundingClientRect();
      dims.current = { w: r.width, h: r.height, rowH: r.height / ROWS };
    };
    compute();
    const ro = new ResizeObserver(compute);
    if (containerRef.current) ro.observe(containerRef.current);
    window.addEventListener('resize', compute);
    return () => { ro.disconnect(); window.removeEventListener('resize', compute); };
  }, [screen]);

  // ============ SPAWN ============
  const spawnFish = useCallback((row, dir, atX = null) => {
    const counts = {};
    SPECIES.forEach(s => counts[s] = 0);
    fishRef.current.forEach(f => { if (!f.caught) counts[f.species]++; });
    const species = pickWeighted(counts);
    const sprite = SPRITES[species];
    const { w: W, rowH } = dims.current;
    const h = rowH * 0.78;
    const w = h * sprite.aspect;
    const x = atX !== null ? atX : (dir > 0 ? -w - 10 : W + 10);
    // Per-row base speed (decided at row level) plus tiny per-fish jitter
    const speed = (rowSpeedsRef.current[row] || 50) * rand(0.92, 1.08);
    fishRef.current.push({
      id: idCount.current++,
      species, row, x, w, h, dir, speed,
      flip: dir < 0,            // sprites face right naturally; mirror when going left
      caught: false, caughtAt: 0,
    });
  }, []);

  const rowSpeedsRef = useRef([]); // per-row base px/sec

  const initRowSpeeds = () => {
    rowSpeedsRef.current = Array.from({ length: ROWS }, () => rand(40, 62));
  };

  const initPopulate = () => {
    fishRef.current = [];
    elsRef.current = {};
    const { w: W } = dims.current;
    for (let row = 0; row < ROWS; row++) {
      const dir = row % 2 === 0 ? 1 : -1;
      const n = 2 + Math.floor(Math.random() * 2); // 2-3 fish per row to start
      for (let i = 0; i < n; i++) {
        // Distribute across width with some randomness
        const x = (W / n) * i + rand(20, 60);
        spawnFish(row, dir, x);
      }
    }
  };

  // ============ GAME LOOP ============
  useEffect(() => {
    if (screen !== 'play') return;

    initRowSpeeds();
    initPopulate();
    forceRender();

    const loop = (t) => {
      const dt = Math.min(0.05, (t - lastT.current) / 1000 || 0);
      lastT.current = t;
      const { w: W } = dims.current;
      const now = t;

      // ---- Timer countdown (TIMED mode only) ----
      if (mode === 'timed') {
        timeLeftRef.current = Math.max(0, timeLeftRef.current - dt);
        // Update progress bar width via direct DOM write (no re-render)
        if (timeBarRef.current) {
          timeBarRef.current.style.width = `${(timeLeftRef.current / ROUND_SECONDS) * 100}%`;
        }
        // Throttle React state update to once per integer second change
        const newSec = Math.ceil(timeLeftRef.current);
        if (newSec !== lastSecRef.current) {
          lastSecRef.current = newSec;
          setTimeLeft(newSec);
          if (newSec <= 3 && newSec > 0) sndTick();
        }
        if (timeLeftRef.current <= 0) {
          sndTimeUp();
          setScreen('results');
          return; // stop scheduling further frames
        }
      }

      // ---- Speed ramp (TIMED mode only) ----
      // Fish accelerate from 1.0x at round start to ~2.2x at round end.
      // Gentle ease-in so the first few seconds feel like the current game
      // and the urgency builds rather than slaps the player.
      let speedMul = 1;
      if (mode === 'timed') {
        const elapsed = ROUND_SECONDS - timeLeftRef.current;
        const t = Math.min(1, elapsed / ROUND_SECONDS);
        speedMul = 1 + Math.pow(t, 1.4) * 1.2;
      }

      // Move all fish; apply transforms directly to DOM
      for (let i = 0; i < fishRef.current.length; i++) {
        const f = fishRef.current[i];
        if (!f.caught) f.x += f.speed * f.dir * dt * speedMul;
        const el = elsRef.current[f.id];
        if (el) {
          // Caught fish do a quick scale+fade
          if (f.caught) {
            const age = (now - f.caughtAt) / 350;
            const s = 1 + Math.min(age, 1) * 0.5;
            const o = Math.max(0, 1 - age);
            el.style.transform = `translate3d(${f.x}px, 0, 0) scale(${f.flip ? -s : s}, ${s})`;
            el.style.opacity = String(o);
          } else {
            el.style.transform = `translate3d(${f.x}px, 0, 0) scaleX(${f.flip ? -1 : 1})`;
          }
        }
      }

      // Cleanup off-screen + finished-caught
      const before = fishRef.current.length;
      fishRef.current = fishRef.current.filter(f => {
        if (f.caught && now - f.caughtAt > 360) return false;
        if (!f.caught) {
          if (f.dir > 0 && f.x > W + 20) return false;
          if (f.dir < 0 && f.x < -f.w - 20) return false;
        }
        return true;
      });
      const afterClean = fishRef.current.length;

      // Spawn fresh fish per row when there's room at the spawn edge
      for (let row = 0; row < ROWS; row++) {
        const dir = row % 2 === 0 ? 1 : -1;
        const rowFish = fishRef.current.filter(f => f.row === row && !f.caught);

        // Find the fish nearest the spawn edge (i.e., last one we spawned)
        let lead = null;
        if (dir > 0) {
          rowFish.forEach(f => { if (!lead || f.x < lead.x) lead = f; });
        } else {
          rowFish.forEach(f => { if (!lead || f.x + f.w > lead.x + lead.w) lead = f; });
        }

        const minGap = rand(40, 110);
        let gap;
        if (!lead) {
          gap = Infinity;
        } else if (dir > 0) {
          gap = lead.x; // distance from spawn edge (left) to leading fish's left
        } else {
          gap = W - (lead.x + lead.w);
        }
        if (gap > minGap) {
          spawnFish(row, dir);
        }
      }

      if (fishRef.current.length !== before || afterClean !== before) forceRender();

      rafRef.current = requestAnimationFrame(loop);
    };

    lastT.current = performance.now();
    rafRef.current = requestAnimationFrame(loop);

    return () => cancelAnimationFrame(rafRef.current);
  }, [screen, mode, spawnFish, forceRender]);

  // ============ POP CLEANUP ============
  useEffect(() => {
    if (screen !== 'play') return;
    const id = setInterval(() => {
      const now = performance.now();
      const before = popsRef.current.length;
      popsRef.current = popsRef.current.filter(p => now - p.t < 900);
      if (popsRef.current.length !== before) forceRender();
    }, 120);
    return () => clearInterval(id);
  }, [screen, forceRender]);

  // ============ TAP ============
  const handleTap = (fish, ev) => {
    if (fish.caught) return;
    if (timeLeftRef.current <= 0) return; // round over, ignore taps
    ev.stopPropagation();
    fish.caught = true;
    fish.caughtAt = performance.now();

    const tgt = targetRef.current;
    const cur = streakRef.current;
    const isMatch = tgt && fish.species === tgt;

    // Helper to update peak after streak changes
    const recordPeak = (newStreak) => {
      if (newStreak > roundPeakRef.current) {
        roundPeakRef.current = newStreak;
        setRoundPeak(newStreak);
      }
      if (newStreak > best) {
        setBest(newStreak);
        try { localStorage.setItem('fm_best', String(newStreak)); } catch (e) {}
      }
    };

    if (!tgt) {
      // First-of-round tap — sets the chain at 1
      setTarget(fish.species);
      setStreak(1);
      recordPeak(1);
      sndFirst();
      flashGood();
      popsRef.current.push({ id: 'p' + fish.id, fishId: fish.id, kind: 'start', t: performance.now() });
    } else if (isMatch) {
      const next = cur + 1;
      setStreak(next);
      recordPeak(next);
      sndMatch(next);
      flashGood();
      popsRef.current.push({ id: 'p' + fish.id, fishId: fish.id, kind: 'plus', n: next, t: performance.now() });
    } else {
      // Wrong fish — chain breaks, new chain starts with this species
      setTarget(fish.species);
      setStreak(1);
      recordPeak(1);
      sndMiss();
      flashBad();
      popsRef.current.push({ id: 'p' + fish.id, fishId: fish.id, kind: 'miss', t: performance.now() });
    }
    forceRender();
  };

  const flashGood = () => {
    setFlash('good');
    if (flashT.current) clearTimeout(flashT.current);
    flashT.current = setTimeout(() => setFlash(null), 180);
  };
  const flashBad = () => {
    setFlash('bad');
    if (flashT.current) clearTimeout(flashT.current);
    flashT.current = setTimeout(() => setFlash(null), 260);
  };

  // ============ NAV ============
  const goToModeSelect = () => {
    try { getCtx()?.resume(); } catch (e) {}
    setScreen('modeSelect');
  };
  const _beginRound = (m) => {
    setMode(m);
    setStreak(0); setTarget(null);
    setRoundPeak(0);
    setTimeLeft(ROUND_SECONDS);
    timeLeftRef.current = ROUND_SECONDS;
    lastSecRef.current = ROUND_SECONDS;
    roundPeakRef.current = 0;
    prevBestRef.current = best;
    setScreen('play');
  };
  const startRelax = () => { try { getCtx()?.resume(); } catch (e) {} _beginRound('relax'); };
  const startTimed = () => { try { getCtx()?.resume(); } catch (e) {} _beginRound('timed'); };
  const playAgain = () => _beginRound(mode || 'timed');
  const endRoundEarly = () => {
    // Used from pause overlay — surface the session results
    setScreen('results');
  };
  const pauseGame = () => setScreen('pause');
  const resumeGame = () => { lastT.current = performance.now(); setScreen('play'); };
  const exitToSplash = () => { setMode(null); setScreen('splash'); };
  const exitToModeSelect = () => { setMode(null); setScreen('modeSelect'); };

  // ============ RENDER ============
  return (
    <div style={styles.app}>
      <style>{globalCSS}</style>

      {screen === 'splash' && (
        <SplashScreen best={best} onStart={goToModeSelect} onHowTo={() => setShowHowTo(true)} />
      )}

      {/* How-to-play overlay (reachable from splash) */}
      {showHowTo && (
        <div style={styles.pauseOverlay} onClick={() => setShowHowTo(false)}>
          <div style={styles.pauseCard} onClick={e => e.stopPropagation()}>
            <div style={styles.pauseTitle}>how to play</div>

            <div style={styles.howToSection}>
              <div style={styles.howToHeader}>THE GOAL</div>
              <div style={styles.howToBody}>
                Build the longest streak of matching fish you can.
              </div>
            </div>

            <div style={styles.howToSection}>
              <div style={styles.howToHeader}>THE RULES</div>
              <div style={styles.howToBody}>
                <div style={styles.howToRule}>
                  <span style={styles.howToBullet}>1</span>
                  <span>Tap any fish — that species becomes your target.</span>
                </div>
                <div style={styles.howToRule}>
                  <span style={styles.howToBullet}>2</span>
                  <span>Tap another of the same species to grow your streak.</span>
                </div>
                <div style={styles.howToRule}>
                  <span style={styles.howToBullet}>3</span>
                  <span>Tap a different species and the chain resets — that fish becomes the new target.</span>
                </div>
              </div>
            </div>

            <div style={styles.howToSection}>
              <div style={styles.howToHeader}>THE MODES</div>
              <div style={styles.howToBody}>
                <div style={styles.howToMode}>
                  <span style={styles.howToModeName}>relax</span>
                  <span>— untimed, end when you want</span>
                </div>
                <div style={styles.howToMode}>
                  <span style={styles.howToModeName}>timed</span>
                  <span>— 20 seconds. The fish speed up as the clock runs out.</span>
                </div>
              </div>
            </div>

            <button onClick={() => setShowHowTo(false)} style={styles.bigBtn}>Got it</button>
          </div>
        </div>
      )}

      {screen === 'modeSelect' && (
        <ModeSelectScreen
          onRelax={startRelax}
          onTimed={startTimed}
          onBack={exitToSplash}
        />
      )}

      {(screen === 'play' || screen === 'pause' || screen === 'results') && (
        <>
          {/* Top progress bar (TIMED mode only) */}
          {mode === 'timed' && (
            <div style={styles.progressTrack}>
              <div
                ref={timeBarRef}
                style={{
                  ...styles.progressFill,
                  width: `${(timeLeftRef.current / ROUND_SECONDS) * 100}%`,
                  background: timeLeft <= 5 ? COLORS.ember : COLORS.ink,
                }}
              />
            </div>
          )}

          {/* HUD */}
          <div style={styles.hud}>
            <div style={styles.hudLeft}>
              <div style={styles.hudLabel}>STREAK</div>
              <div style={styles.streakRow}>
                <div key={streak} style={{...styles.streakNum, animation: streak > 0 ? 'pulse 380ms cubic-bezier(.2,.8,.3,1.4)' : 'none'}}>
                  {streak}
                </div>
                {target && (
                  <img src={SPRITES[target].src} alt={target} style={styles.streakTargetImg} />
                )}
              </div>
            </div>

            <div style={styles.hudCenter}>
              {mode === 'timed' ? (
                <>
                  <div style={styles.hudLabel}>TIME</div>
                  <div
                    key={timeLeft}
                    style={{
                      ...styles.timeNum,
                      color: timeLeft <= 5 ? COLORS.ember2 : COLORS.ink,
                      animation: timeLeft <= 5 && timeLeft > 0 ? 'pulse 380ms cubic-bezier(.2,.8,.3,1.4)' : 'none',
                    }}
                  >
                    {timeLeft}
                  </div>
                </>
              ) : (
                <div style={styles.relaxBadge}>relax</div>
              )}
            </div>

            <div style={styles.hudRight}>
              <div style={styles.hudLabel}>BEST</div>
              <div style={styles.bestNum}>{best}</div>
              {screen === 'play' && (
                <button onClick={pauseGame} style={styles.pauseBtn} aria-label="Pause">
                  <svg width="14" height="16" viewBox="0 0 14 16" fill="none">
                    <rect x="0" y="0" width="4.5" height="16" rx="1.5" fill={COLORS.ink}/>
                    <rect x="9.5" y="0" width="4.5" height="16" rx="1.5" fill={COLORS.ink}/>
                  </svg>
                </button>
              )}
            </div>
          </div>

          {/* Pond — the playing field */}
          <div ref={containerRef} style={styles.pond}>
            {/* Subtle row separators for very faint depth */}
            {Array.from({ length: ROWS }).map((_, i) => (
              <div key={i} style={{
                ...styles.rowLine,
                top: `${(i + 1) * (100 / ROWS)}%`,
              }} />
            ))}

            {/* Fish */}
            {fishRef.current.map(f => {
              const rowTop = f.row * dims.current.rowH + (dims.current.rowH - f.h) / 2;
              return (
                <div
                  key={f.id}
                  ref={el => { if (el) elsRef.current[f.id] = el; else delete elsRef.current[f.id]; }}
                  onPointerDown={(e) => handleTap(f, e)}
                  style={{
                    position: 'absolute',
                    left: 0,
                    top: rowTop,
                    width: f.w,
                    height: f.h,
                    transform: `translate3d(${f.x}px, 0, 0) scaleX(${f.flip ? -1 : 1})`,
                    willChange: 'transform',
                    touchAction: 'manipulation',
                    cursor: 'pointer',
                    userSelect: 'none',
                    WebkitUserSelect: 'none',
                    WebkitTapHighlightColor: 'transparent',
                  }}
                >
                  <img
                    src={SPRITES[f.species].src}
                    alt={f.species}
                    draggable={false}
                    style={{ width: '100%', height: '100%', pointerEvents: 'none', display: 'block' }}
                  />
                </div>
              );
            })}

            {/* Floating pops */}
            {popsRef.current.map(p => {
              const f = fishRef.current.find(x => x.id === p.fishId);
              if (!f) return null;
              const x = f.x + f.w / 2;
              const y = f.row * dims.current.rowH + dims.current.rowH / 2;
              const label = p.kind === 'miss' ? 'reset' : p.kind === 'start' ? 'go' : `+${p.n}`;
              const color = p.kind === 'miss' ? COLORS.miss : COLORS.success;
              return (
                <div key={p.id} style={{
                  position: 'absolute',
                  left: x, top: y,
                  transform: 'translate(-50%, -50%)',
                  pointerEvents: 'none',
                  animation: 'floatUp 850ms ease-out forwards',
                  fontFamily: 'DM Sans, sans-serif',
                  fontWeight: 700,
                  fontSize: p.kind === 'miss' ? 18 : (p.kind === 'start' ? 22 : 26),
                  color,
                  letterSpacing: p.kind === 'miss' ? 0.5 : 0,
                  textTransform: p.kind === 'miss' ? 'uppercase' : 'none',
                  textShadow: `0 1px 0 ${COLORS.paper}`,
                }}>
                  {label}
                </div>
              );
            })}

            {/* Flash overlay */}
            {flash && (
              <div style={{
                position: 'absolute', inset: 0, pointerEvents: 'none',
                background: flash === 'good' ? 'rgba(92,138,82,0.10)' : 'rgba(194,90,78,0.16)',
                animation: 'flashFade 200ms ease-out forwards',
              }} />
            )}
          </div>

          {/* Pause overlay */}
          {screen === 'pause' && (
            <div style={styles.pauseOverlay}>
              <div style={styles.pauseCard}>
                <div style={styles.pauseTitle}>paused</div>
                <div style={styles.pauseStats}>
                  <div>
                    <div style={styles.pauseStatLabel}>STREAK</div>
                    <div style={styles.pauseStatNum}>{streak}</div>
                  </div>
                  <div style={styles.pauseDivider} />
                  <div>
                    <div style={styles.pauseStatLabel}>BEST</div>
                    <div style={styles.pauseStatNum}>{best}</div>
                  </div>
                </div>
                <button onClick={resumeGame} style={styles.bigBtn}>Resume</button>
                <button onClick={endRoundEarly} style={styles.linkBtn}>
                  {mode === 'relax' ? 'End session' : 'End round'}
                </button>
              </div>
            </div>
          )}

          {/* Results overlay */}
          {screen === 'results' && (
            <div style={styles.pauseOverlay}>
              <div style={styles.pauseCard}>
                <div style={styles.pauseTitle}>
                  {mode === 'relax' ? 'nice run' : 'time!'}
                </div>

                <div style={styles.pauseStats}>
                  <div>
                    <div style={styles.pauseStatLabel}>
                      {mode === 'relax' ? 'SESSION PEAK' : 'ROUND PEAK'}
                    </div>
                    <div style={styles.pauseStatNum}>{roundPeak}</div>
                  </div>
                  <div style={styles.pauseDivider} />
                  <div>
                    <div style={styles.pauseStatLabel}>BEST EVER</div>
                    <div style={styles.pauseStatNum}>{best}</div>
                  </div>
                </div>

                {roundPeak > prevBestRef.current && roundPeak > 0 && (
                  <div style={styles.newBestBadge}>★ new personal best</div>
                )}
                {roundPeak === 0 && (
                  <div style={styles.emptyRound}>
                    {mode === 'relax' ? 'no catches yet — try again?' : 'no catches this round — try again?'}
                  </div>
                )}

                <button onClick={playAgain} style={styles.svgBtn} aria-label="Play Again">
                  <img
                    src={PLAYAGAIN_SRC}
                    alt="PLAY AGAIN"
                    style={styles.svgBtnLabel}
                    draggable={false}
                  />
                </button>
                <button onClick={exitToModeSelect} style={styles.linkBtn}>Change mode</button>
              </div>
            </div>
          )}
        </>
      )}
    </div>
  );
}

// ============ SPLASH ============
function SplashScreen({ best, onStart, onHowTo }) {
  // Decorative fish drifting across the splash
  const [tick, setTick] = useState(0);
  useEffect(() => {
    const id = setInterval(() => setTick(t => t + 1), 32);
    return () => clearInterval(id);
  }, []);

  const decor = [
    { species: 'trout',    row: 1, dir:  1, speed: 28, offset: 0,    size: 0.95 },
    { species: 'bluegill', row: 3, dir: -1, speed: 22, offset: 0.4,  size: 0.85 },
    { species: 'goldfish', row: 5, dir:  1, speed: 32, offset: 0.7,  size: 1.0  },
    { species: 'catfish',  row: 6, dir: -1, speed: 26, offset: 0.2,  size: 0.9  },
    { species: 'pike',     row: 7, dir:  1, speed: 30, offset: 0.55, size: 0.85 },
  ];

  return (
    <div style={styles.splash}>
      {/* Decorative swimming fish */}
      <div style={{
        position: 'absolute', inset: 0, overflow: 'hidden',
        opacity: 0.35, pointerEvents: 'none',
      }}>
        {decor.map((d, i) => {
          const period = 14; // seconds for a full traverse
          const t = (tick * 32 / 1000 + d.offset * period) % period;
          const progress = t / period; // 0..1
          const x = d.dir > 0 ? -120 + progress * (window.innerWidth + 240) : window.innerWidth + 120 - progress * (window.innerWidth + 240);
          const y = 100 + d.row * 70;
          const w = 140 * d.size;
          const h = w / SPRITES[d.species].aspect;
          return (
            <img key={i} src={SPRITES[d.species].src} alt=""
                 style={{
                   position: 'absolute',
                   left: x, top: y,
                   width: w, height: h,
                   transform: `scaleX(${d.dir < 0 ? -1 : 1})`,
                 }} />
          );
        })}
      </div>

      <div style={styles.splashInner}>
        <div style={styles.splashKicker}>a quiet little game</div>
        <img
          src={LOGO_SRC}
          alt="FISHMATCH"
          style={styles.splashLogo}
          draggable={false}
        />
        <p style={styles.splashDesc}>
          Fish swim past in eight lanes. Tap one — then tap another just like it,
          and another, and another. How long can you keep the streak going?
        </p>

        <button onClick={onStart} style={styles.startBtn} aria-label="Start Fishing">
          <img
            src={STARTBTN_SRC}
            alt="START FISHING"
            style={styles.startBtnLabel}
            draggable={false}
          />
        </button>

        <button onClick={onHowTo} style={styles.howToLink}>
          how to play
        </button>

        {best > 0 && (
          <div style={styles.bestBadge}>
            personal best <span style={{ fontWeight: 700, color: COLORS.ink, marginLeft: 6 }}>{best}</span>
          </div>
        )}
      </div>
    </div>
  );
}

// ============ MODE SELECT ============
function ModeSelectScreen({ onRelax, onTimed, onBack }) {
  return (
    <div style={styles.splash}>
      <button onClick={onBack} style={styles.backBtn} aria-label="Back">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M9 2 L4 7 L9 12" stroke={COLORS.ink} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      </button>
